name: Build Pages assets

on:
  push:
    branches: [main]
    paths-ignore: [deploy/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          mkdir -p deploy
          cp dist/deploy/app.js deploy/app.js
          cp dist/deploy/app.css deploy/app.css
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy
          git diff --cached --quiet || git commit -m "Build Pages assets"
          git push
